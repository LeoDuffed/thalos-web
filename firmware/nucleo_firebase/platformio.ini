[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
build_src_filter = +<main.cpp>
lib_deps = bblanchon/ArduinoJson@7.4.2
extra_scripts = pre:../ld2450_firebase/load_env.py
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
